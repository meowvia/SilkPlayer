name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          if [ -n "${XCODE_PATH}" ]; then
            echo "Selecting Xcode at ${XCODE_PATH}..."
            sudo xcode-select -s "${XCODE_PATH}"
          fi
          xcodebuild -version
          swift --version

      - name: Run Automated Test Suite
        id: tests
        run: |
          chmod +x scripts/run_tests.sh
          set -o pipefail
          ./scripts/run_tests.sh 2>&1 | tee test_run.log

      - name: Diagnostics Report on Failure
        if: failure()
        run: |
          echo "### CI Test Failure Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat test_run.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "failed|error:|Assertion failed|XCTAssert|failure" test_run.log | head -n 25 | while IFS= read -r line; do
            echo "::error::${line}"
          done
